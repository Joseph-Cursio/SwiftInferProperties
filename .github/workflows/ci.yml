name: CI

# Runs on pushes to main and on pull requests into main; it can also be
# started by hand from the Actions tab. The job uses a standard GitHub-hosted
# runner (`macos-15`), which is free because this repository is public.
# Minutes become billable if the repository goes private or a job moves to a
# larger runner (e.g. `macos-15-xlarge`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      # SwiftInferProperties depends on SwiftPropertyLaws via a local path
      # (`../SwiftPropertyLaws`) during pre-1.0 development. Check both repos
      # out side-by-side so SPM can resolve the path dep.
      - name: Checkout SwiftInferProperties
        uses: actions/checkout@v6
        with:
          path: SwiftInferProperties
      - name: Checkout SwiftPropertyLaws
        uses: actions/checkout@v6
        with:
          repository: Joseph-Cursio/SwiftPropertyLaws
          ref: main
          path: SwiftPropertyLaws
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        working-directory: SwiftInferProperties
        run: swift test --disable-experimental-prebuilts
