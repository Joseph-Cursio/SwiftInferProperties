name: CI

# Runs on pushes to main and on pull requests into main; it can also be
# started by hand from the Actions tab. The job uses a standard GitHub-hosted
# runner, which is free because this repository is public. Minutes become
# billable if the repository goes private or a job moves to a larger runner
# (e.g. `xcode-27-xlarge`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS)
    # `xcode-27` is GitHub's macOS 27 image with Xcode 27, still marked preview
    # (actions/runner-images#14404). The `macos-15` image tops out at Xcode
    # 26.3 (Swift 6.2), which failed to type-check a test in run 40910337304;
    # the package is developed on Xcode 27 / Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # SwiftPM resolves every dependency by URL, so none of the sibling
      # checkouts below feed the build. Some fast tests read them at
      # `../<name>`, as on a developer machine: DeferralFalsifierTests fails
      # when a falsifier names a repository that is not checked out
      # (SwiftPropertyLaws and SwiftProjectLint), and SEICrossRepoPinTests and
      # EffectVocabularyCrossRepoTests skip without SwiftProjectLint and
      # SwiftIdempotency.
      - name: Checkout SwiftInferProperties
        uses: actions/checkout@v6
        with:
          path: SwiftInferProperties
      - name: Checkout SwiftPropertyLaws
        uses: actions/checkout@v6
        with:
          repository: Joseph-Cursio/SwiftPropertyLaws
          path: SwiftPropertyLaws
      - name: Checkout SwiftProjectLint
        uses: actions/checkout@v6
        with:
          repository: Joseph-Cursio/SwiftProjectLint
          path: SwiftProjectLint
      - name: Checkout SwiftIdempotency
        uses: actions/checkout@v6
        with:
          repository: Joseph-Cursio/SwiftIdempotency
          path: SwiftIdempotency
      # Pinned to the developer machine's Xcode rather than `latest-stable`, so
      # a new Xcode release cannot change the compiler under an unchanged
      # commit. Move it when the developer machine moves. (As of 2026-11-02 the
      # image carries 27.2 only as its release candidate, build 27B48.)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      # The fast suite: the Makefile's `test-fast` filter, without its SwiftLint
      # gate (the image has no SwiftLint) or its wall-clock budget (sized for a
      # developer machine). The measured batches and the §13 perf suites are
      # left to `make test`, which runs them one at a time. Keep the pattern in
      # step with the Makefile's SUBPROCESS_RE and PERF_RE.
      - name: Run tests
        working-directory: SwiftInferProperties
        run: >-
          swift test --disable-experimental-prebuilts
          --skip 'MeasuredTests|MeasuredExecutionTests|VerifyPipeline|PerformanceTests'
